# default configuration - won't be overridden
# Copied once into karaf/etc, then edit it there

# Enable the filter
enabled=true

# Comma-separated site keys, empty = all sites (e.g. academy)
sites=

# Render modes where anchors are added (live, preview, edit)
modes=live,preview

# Heading tags to process
headings=h1,h2,h3,h4,h5

# Ordered scope selectors: tag, #id, .class, tag#id, tag.class
# The first selector matching at least one element is used, e.g. "main,body" = <main> if present, else <body>
scope=main,body

# heading = id set on the heading itself (an existing id is kept)
# anchor  = empty <a id="slug" class="..."></a> inserted as first child of the heading
mode=heading
anchor.class=heading-anchor
# Also add the legacy name attribute on the injected <a> (obsolete in HTML5)
anchor.name=false

# Copy-permalink button displayed on heading hover / keyboard focus
permalink.enabled=false
# {0} is replaced by the heading text
permalink.label=Copy link to section: {0}
permalink.copiedMessage=Link copied to clipboard
permalink.fallbackMessage=Link is in the address bar

# scroll-margin-top of anchored headings (height of a sticky header), e.g. 120px; empty = 1rem
scrollMarginTop=
